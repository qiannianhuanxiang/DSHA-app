plugins {
    id 'com.android.application'
}

// 两版共用功能和离线环境；只有 low 携带兼容旧 Android 的 Gecko 内核。
// 文件名独立于可诊断版本名，保持当前用户下载入口不变。
ext.dshaApkNameVersion = '0.2.1-rc.3'
def bundledTools = new groovy.json.JsonSlurper().parse(rootProject.file('tools/runtime-tools.lock.json'))
if (bundledTools.schema != 1 || !(bundledTools.pnpm.version ==~ /[0-9]+\.[0-9]+\.[0-9]+/))
    throw new GradleException('随包工具身份格式错误')
// BEGIN DSHA_BUNDLED_DSH_VERSION_GATE
// Read during configuration too: assemble/package/test must reject a mixed native/asset generation.
def verifyBundledDshGeneration = {
    def manifest = new groovy.json.JsonSlurper().parse(rootProject.file('tools/dsh-runtime/package.json'))
    def lock = new groovy.json.JsonSlurper().parse(rootProject.file('tools/dsh-runtime/package-lock.json'))
    def registry = new groovy.json.JsonSlurper().parse(file('src/main/assets/runtime-patches.json'))
    def source = file('src/main/java/com/deepseekharness/app/util/Constants.java').getText('UTF-8')
    def declarations = (source =~ /(?m)^\s*public static final String DSH_VERSION = "([^"\r\n]+)";\s*$/)
    if (declarations.count != 1)
        throw new GradleException('BUNDLED_DSH_NATIVE_VERSION_ANCHOR')
    def version = manifest.dependencies['@deepseek-ai/dsh']
    if (!(version instanceof String) || !(version ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/)
            || manifest.version != version || lock.version != version
            || lock.packages[''].version != version
            || lock.packages[''].dependencies['@deepseek-ai/dsh'] != version
            || lock.packages['node_modules/@deepseek-ai/dsh'].version != version
            || registry.schema != 1 || registry.dshVersion != version
            || declarations[0][1] != version)
        throw new GradleException('BUNDLED_DSH_VERSION_MISMATCH: native, npm lock and signed patch registry must agree')
}
verifyBundledDshGeneration()
def verifyBundledDshVersion = tasks.register('verifyBundledDshVersion') {
    inputs.files(rootProject.files('tools/dsh-runtime/package.json', 'tools/dsh-runtime/package-lock.json'))
    inputs.files(file('src/main/assets/runtime-patches.json'),
            file('src/main/java/com/deepseekharness/app/util/Constants.java'))
    doLast { verifyBundledDshGeneration() }
}
// END DSHA_BUNDLED_DSH_VERSION_GATE
// CI 只生成未签名完整包；该产物不得进入 release 或覆盖安装。
def unsignedPackage = project.findProperty('dsha.unsignedPackage') == 'true'
// 个人测试分支：显式开关才改包名/版本名，默认构建与基线完全一致。
def sunsetTest = project.findProperty('dsha.sunsetTest') == 'true' || System.getenv('DSHA_SUNSET_TEST') == '1'
// 独立上岛版：显式开关才换包名，与正式 DSHA 共存且数据完全隔离；默认构建不变。
def islandEdition = project.findProperty('dsha.islandEdition') == 'true' || System.getenv('DSHA_ISLAND_EDITION') == '1'
if (sunsetTest && islandEdition)
    throw new GradleException('Sunset 测试版和独立上岛版不能同时启用')
// 只有源码 CI 可显式允许缺少真实测试夹具；完整测试默认要求固定输入齐备。
def sourceOnlyTests = providers.gradleProperty('dsha.sourceOnlyTests').orElse('false').get()
if (!(sourceOnlyTests in ['true', 'false']))
    throw new GradleException('dsha.sourceOnlyTests 只接受 true 或 false')

android {
    namespace 'com.deepseekharness.app'
    compileSdk {
        version = release(37)
    }
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "dsh.android.bxroot"
        minSdk 30
        targetSdk 37
        buildConfigField 'String', 'BUNDLED_PNPM_VERSION', '"' + bundledTools.pnpm.version + '"'
        // 供界面区分「正式版 / 独立上岛版」；包名与数据目录由 applicationIdSuffix 隔离。
        buildConfigField 'boolean', 'ISLAND_EDITION', islandEdition ? 'true' : 'false'
        // 上岛版用独立显示名，避免桌面上与正式 DSHA 同名、误以为是同一个应用。
        resValue 'string', 'app_name', islandEdition ? 'DSHA 上岛版' : 'DSHA'
        versionCode 214
        // DSHA 修订号 + 固定的北京时间戳 + 内置 DSH 版本；同一交付重建不变。
        versionName "0.2.1-rc.3-bxroot.12-dsh0.2.1-rc.3"
        testInstrumentationRunner project.findProperty('dsha.testRunner') ?: "com.deepseekharness.app.Rc13Instrumentation"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions 'androidSupport'
    productFlavors {
        standard {
            dimension 'androidSupport'
            minSdk 30
            buildConfigField 'boolean', 'LOW_ANDROID', 'false'
            if (sunsetTest) {
                applicationIdSuffix '.SunsetRNE'
                versionNameSuffix '-SunsetTest'
            } else if (islandEdition) {
                applicationIdSuffix '.island'
                versionNameSuffix '-island'
            }
        }
        low {
            dimension 'androidSupport'
            minSdk 23
            versionNameSuffix sunsetTest ? 'low-SunsetTest' : 'low'
            buildConfigField 'boolean', 'LOW_ANDROID', 'true'
            if (sunsetTest) {
                applicationIdSuffix '.SunsetRNE'
            } else if (islandEdition) {
                applicationIdSuffix '.island'
            }
        }
    }

    signingConfigs {
        // 线上发布签名 = DSHA-ACTUAL-PUBLISH-KEY-debug.keystore（alias androiddebugkey，
        // 证书 SHA-256 E7:E3:A3:1A:75:94:6F:26:69:19:4C:97:2B:3D:D0:C9:AE:A3:FC:7C:50:A8:B8:85:D2:DE:E7:10:B2:2A:53:F5）。
        // v1.1.7 起线上包都是这把 debug keystore 签的（历史原因，勿换），
        // Android 只允许同签名覆盖安装，换钥 = 逼用户卸载重装丢数据。
        // 另一把 DSHA-release.keystore 只签增量更新清单，绝不混用。
        // 正式任务必须明确提供历史发布证书；单测/debug 不依赖发布密钥。
        publish {
            def ksPath = System.getenv("DSHA_KEYSTORE") ?: project.findProperty("dsha.keystore")
            if (ksPath != null && !ksPath.toString().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DSHA_KEYSTORE_PASSWORD")
                        ?: project.findProperty("dsha.keystore.password")
                keyAlias System.getenv("DSHA_KEY_ALIAS")
                        ?: project.findProperty("dsha.key.alias") ?: "androiddebugkey"
                keyPassword System.getenv("DSHA_KEY_PASSWORD")
                        ?: project.findProperty("dsha.key.password")
                if (!storePassword || !keyPassword)
                    throw new GradleException('必须明确提供发布密钥口令，不能使用隐式缺省值')
                println "签名：已配置历史发布证书"
            } else {
                println "签名：未配置历史发布证书；正式 APK 打包将被阻止"
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            if (!unsignedPackage) signingConfig signingConfigs.publish
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // 应急启动器按签名 APK 中的完整字节校验，禁止打包阶段再改写这两份 ELF。
            keepDebugSymbols += ['**/libproot.so', '**/libprootloader.so']
            // 使用 app 自带的同版本 16 KB JNI，覆盖 terminal-emulator AAR 中的旧库。
            pickFirsts += ['**/libtermux.so']
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi/**', '**/armeabi-v7a/**']
        }
    }

    androidResources {
        // 'bin' 是离线 rootfs：aapt 会把 .tar.gz 静默解成 .tar，所以打包前改名 .bin，
        // 保持 STORED（不 deflate），避免对已经压缩的离线运行时再压缩一次。
        noCompress += ['gz', 'xz', 'bin', 'ja', 'tar', 'whl']
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues = true
        aidl = true
        buildConfig = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // 完整 Standard 套件在同一测试 JVM 内运行 2500+ 项，并包含 25MB 位图边界和
        // 多组 Robolectric 界面沙箱；默认堆上限会在与断言无关的位图分配处 OOM。
        // 这里只提高测试进程内存上限，不放宽或跳过任何用例。
        unitTests.all { it.maxHeapSize = '2048m' }
    }

    sourceSets {
        // The promoted notification permission belongs only to the isolated island package.
        if (islandEdition) {
            standard.manifest.srcFile 'src/islandEdition/AndroidManifest.xml'
            low.manifest.srcFile 'src/islandEdition/AndroidManifest.xml'
        }
        main.assets.setSrcDirs([layout.buildDirectory.dir("generated/standardAssets").get().asFile,
                layout.buildDirectory.dir("generated/recoveryAssets").get().asFile])
        main.java.srcDir(layout.buildDirectory.dir("generated/uiLanguage").get().asFile)
        // Both browser test entry points load one test-only HTML fixture.
        debug.assets.srcDir(rootProject.file("tools/fixtures/web-state"))
        androidTest.assets.srcDir(rootProject.file("tools/fixtures/web-state"))
    }
}

def verifyPublishCertificate = tasks.register("verifyPublishCertificate") {
    doLast {
        def signing = android.signingConfigs.publish
        if (signing.storeFile == null || !signing.storeFile.isFile())
            throw new GradleException("正式 APK 缺少历史 E7E3 发布密钥，停止打包")
        def store = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
        signing.storeFile.withInputStream { store.load(it, signing.storePassword.toCharArray()) }
        def certificate = store.getCertificate(signing.keyAlias)
        def expected = new groovy.json.JsonSlurper().parse(rootProject.file('ci/release-identity.json')).certificateSha256
        if (certificate == null || java.security.MessageDigest.getInstance("SHA-256")
                .digest(certificate.encoded).encodeHex().toString() != expected)
            throw new GradleException("发布证书不是历史 E7E3，停止打包")
    }
}
tasks.configureEach {
    if (!unsignedPackage && name.matches("(package|validateSigning|assemble)(Standard|Low)Release")) dependsOn(verifyPublishCertificate)
}
tasks.register('signPublishRelease') {
    if (!unsignedPackage) dependsOn(verifyPublishCertificate, 'assembleStandardRelease')
    doFirst {
        if (unsignedPackage) throw new GradleException('未签名 CI 模式不能执行正式发布任务')
    }
}

