def verifyBackupDependencies = tasks.register("verifyBackupDependencies") {
    inputs.file(rootProject.file("tools/backup-dependencies.lock.json"))
    doLast {
        def lock = new groovy.json.JsonSlurper().parse(rootProject.file("tools/backup-dependencies.lock.json"))
        def requiredCoordinates = ["com.google.code.gson:gson", "org.bouncycastle:bcprov-jdk15to18", "org.yaml:snakeyaml"] as Set
        if (!(lock instanceof Map) || lock.version != 1 || !(lock.dependencies instanceof List)
                || lock.dependencies.size() != requiredCoordinates.size())
            throw new GradleException("备份依赖锁格式错误")
        def coordinates = new HashSet<String>()
        lock.dependencies.each { expected ->
            if (!(expected instanceof Map) || !(expected.group instanceof String)
                    || !(expected.name instanceof String) || !(expected.version instanceof String)
                    || !(expected.sha256 instanceof String) || !(expected.license instanceof String)
                    || !(expected.licenseAsset instanceof String) || !(expected.source instanceof String)
                    || !(expected.group ==~ /[A-Za-z0-9_.-]+/) || !(expected.name ==~ /[A-Za-z0-9_.-]+/)
                    || !(expected.version ==~ /[A-Za-z0-9][A-Za-z0-9_.+-]*/)
                    || !(expected.sha256 ==~ /[a-f0-9]{64}/) || expected.license.isEmpty()
                    || !(expected.licenseAsset ==~ /licenses\/[A-Za-z0-9_.-]+\.txt/)
                    || !expected.source.startsWith("https://")
                    || !coordinates.add(expected.group + ":" + expected.name)
                    || (expected.licenseSha256 != null && (!(expected.licenseSha256 instanceof String)
                        || !(expected.licenseSha256 ==~ /[a-f0-9]{64}/))))
                throw new GradleException("备份依赖锁记录无效或坐标重复")
        }
        if (coordinates != requiredCoordinates) throw new GradleException("备份依赖锁缺少必需坐标")
        def fileDigest = { File content ->
            def hash = java.security.MessageDigest.getInstance("SHA-256")
            content.withInputStream { input ->
                byte[] buffer = new byte[65536]; int count
                while ((count = input.read(buffer)) != -1) hash.update(buffer, 0, count)
            }
            hash.digest().encodeHex().toString()
        }
        ["standardReleaseRuntimeClasspath", "lowReleaseRuntimeClasspath"].each { name ->
            def resolved = configurations.getByName(name).resolvedConfiguration.resolvedArtifacts
            lock.dependencies.each { expected ->
                def selected = resolved.findAll { it.moduleVersion.id.group == expected.group && it.name == expected.name }
                if (selected.size() != 1 || selected[0].moduleVersion.id.version != expected.version)
                    throw new GradleException("备份依赖版本未锁定：${expected.group}:${expected.name}")
                if (fileDigest(selected[0].file) != expected.sha256)
                    throw new GradleException("备份依赖摘要不符：${expected.name}")
                def license = file("src/main/assets/${expected.licenseAsset}")
                if (!license.isFile())
                    throw new GradleException("缺少备份依赖许可：${expected.name}")
                if (expected.licenseSha256 != null && fileDigest(license) != expected.licenseSha256)
                    throw new GradleException("备份依赖许可摘要不符：${expected.name}")
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach { dependsOn(verifyBackupDependencies) }
tasks.named("preBuild").configure { dependsOn(prepareStandardAssets, prepareRecoveryAssets) }
def prepareUiLanguages = tasks.register("prepareUiLanguages", Exec) {
    inputs.file(rootProject.file("tools/prepare-ui-languages.py"))
    inputs.file(rootProject.file("tools/i18n/messages.json"))
    inputs.files(rootProject.files("tools/ui_language_catalog.py", "tools/i18n/messages-extra.json"))
    inputs.files(rootProject.fileTree("tools/i18n/translations") { include "*.json" })
    inputs.files(rootProject.fileTree("tools/i18n/translations-extra") { include "*.json" })
    outputs.dir(layout.buildDirectory.dir("generated/uiLanguage"))
    commandLine(System.getenv("DSHA_PYTHON") ?: "python3", "-B",
            rootProject.file("tools/prepare-ui-languages.py").absolutePath,
            "--output", layout.buildDirectory.dir("generated/uiLanguage").get().asFile.absolutePath)
}
tasks.named("preBuild").configure { dependsOn(prepareUiLanguages) }

def verifyUiLanguageResources = tasks.register("verifyUiLanguageResources", Exec) {
    inputs.files(rootProject.files("tools/localize-android-ui.py", "tools/ui_language_catalog.py",
            "tools/i18n/messages.json", "tools/i18n/messages-extra.json", "tools/i18n/android-resources.json"))
    inputs.files(rootProject.fileTree("tools/i18n/translations") { include "*.json" })
    inputs.files(rootProject.fileTree("tools/i18n/translations-extra") { include "*.json" })
